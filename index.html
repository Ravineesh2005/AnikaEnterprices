<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anika Enterprises | Professional Crane Services</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome — for WhatsApp & Phone icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================================
         NAVIGATION BAR
    ======================================================== -->
    <nav class="navbar">

        <!-- Company Logo / Name -->
        <div class="nav-logo">Anika Enterprises</div>

        <!-- Hamburger button — visible only on mobile -->
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Nav Links — collapses into a dropdown on mobile -->
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>

    </nav>


    <!-- ========================================================
         HERO SECTION  (full screen background image)
    ======================================================== -->
    <section class="hero">

        <!-- Dark overlay so text stays readable on the bg image -->
        <div class="hero-overlay"></div>

        <!-- Center content -->
        <div class="hero-content">

            <!-- SVG Text: draws border first, then fills with white -->
            <svg class="hero-title" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
                <text x="50%" y="72%" text-anchor="middle" dominant-baseline="middle">
                    Anika Enterprises
                </text>
            </svg>

            <!-- Subtitle fades in after title animation ends -->
            <p class="hero-subtitle">Professional Crane Services You Can Trust</p>

        </div>

    </section>


    <!-- ========================================================
         QUERY FORM SECTION
    ======================================================== -->
    <section class="query-section">

        <div class="query-container">

            <!-- Section heading -->
            <div class="query-header">
                <h2 class="query-title">Get a <span>Free Quote</span></h2>
                <p class="query-subtitle">Fill in the form below and our team will get back to you shortly</p>
            </div>

            <!-- Formspree handles form submission — sends email on submit -->
            <form class="query-form" action="https://formspree.io/f/xnpawldz" method="POST">

                <!-- Row: Name + Phone side by side -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                    </div>

                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <!-- Message -->
                <div class="form-group">
                    <label for="message">Your Query</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us about your crane service requirements..." required></textarea>
                </div>

                <button type="submit" class="form-submit">Send Query &rarr;</button>

            </form>

        </div>

    </section>


    <!-- ========================================================
         FLOATING ACTION BUTTONS
         WhatsApp — bottom right
         Phone    — bottom left
    ======================================================== -->

    <!-- WhatsApp floating button -->
    <a href="https://wa.me/919876543210"
       class="float-btn whatsapp-btn"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Phone floating button -->
    <a href="tel:+919876543210"
       class="float-btn phone-btn"
       aria-label="Call us">
        <i class="fas fa-phone"></i>
    </a>


    <!-- ========================================================
         HAMBURGER TOGGLE SCRIPT
    ======================================================== -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks  = document.getElementById('nav-links');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('open');
            navLinks.classList.toggle('open');
        });

        /* Close menu when a link is clicked */
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('open');
                navLinks.classList.remove('open');
            });
        });
    </script>

</body>

</html>
